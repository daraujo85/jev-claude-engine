<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>App shell - controle + bugs de SPA</title>
<style>
  /* Layout de SPA: o documento não rola, quem rola é o .conteudo. Padrão
     legítimo que confundia a detecção de oclusão por scroll. */
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; overflow: hidden; }
  body { font-family: system-ui, sans-serif; font-size: 16px; color: #222; background: #fff; display: flex; flex-direction: column; }
  button, input, select, textarea, .btn { min-height: 48px; font-size: 16px; }
  .btn { display: inline-flex; align-items: center; padding: 0 16px; background: #0b5394; color: #fff; border: 0; border-radius: 6px; }
  .barra { flex: 0 0 56px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; border-bottom: 1px solid #ddd; }
  .conteudo { flex: 1; overflow-y: auto; padding: 16px; }
  .bloco { height: 400px; background: #f4f6f8; margin-bottom: 16px; padding: 16px; }
  .rodape-fixo { flex: 0 0 64px; display: flex; align-items: center; padding: 0 16px; border-top: 1px solid #ddd; }
  /* S1 bug: toast absoluto preso sobre o rodapé, tapando o "Concluir" em qualquer scroll */
  .toast { position: absolute; left: 0; right: 0; bottom: 0; height: 64px; background: #333; color: #fff; padding: 20px 16px; }
  /* S2 bug: campo de valor com rótulo cortado */
  .valor { display: inline-block; width: 120px; white-space: nowrap; overflow: hidden; }
</style>
</head>
<body>
  <header class="barra"><strong>App</strong><button class="btn sair">Sair</button></header>
  <div class="conteudo" tabindex="0" aria-label="Conteúdo">
    <div class="bloco">Seção 1</div>
    <div class="bloco">Seção 2</div>
    <label for="v" class="valor">Valor total do contrato com juros</label>
    <input id="v" type="text">
    <div class="bloco">Seção 3</div>
    <button class="btn fim-lista">Carregar mais</button> <!-- controle: alcançável rolando o .conteudo -->
  </div>
  <footer class="rodape-fixo"><button class="btn concluir">Concluir</button></footer>
  <div class="toast" role="status">Rascunho salvo</div>
</body>
</html>
